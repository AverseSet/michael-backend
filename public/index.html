<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael AI - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        #error-msg {
            color: #f43f5e;
            text-align: center;
            font-size: 14px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Michael AI</h2>
        <p class="subtitle">Enter your credentials to access</p>
        
        <form id="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="e.g. friend_one" required autocomplete="username">
            </div>
            
            <div class="input-group">
                <label for="accessKey">Access Key</label>
                <input type="password" id="accessKey" placeholder="Paste your key here" required autocomplete="current-password">
            </div>
            
            <button type="submit" id="login-btn">Log In</button>
        </form>

        <div id="error-msg"></div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.textContent = "";

            const username = document.getElementById('username').value.trim();
            const accessKey = document.getElementById('accessKey').value.trim();

            try {
                // Change 'localhost' to your computer's local IP address (like 192.168.1.X) when testing from a phone on Wi-Fi!
                const response = await fetch('http://localhost:5000/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, accessKey })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Login failed.");
                }

                // Save the JWT token in the browser storage
                localStorage.setItem('michael_token', data.token);
                localStorage.setItem('michael_username', data.username);

                // Success! Redirect to your main app interface
                alert(`Welcome back, ${data.username}!`);
                // window.location.href = 'chat.html'; // Point this to your main app file later

            } catch (err) {
                errorDiv.textContent = err.message;
            }
        });
    </script>
</body>
</html>
