<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0f0f17;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: #1e1e2f;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            border: 1px solid #6c5ce7;
        }
        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #a29bfe;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #fff;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #fff;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f0f17;
            border: 1px solid #6c5ce7;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 0 2px rgba(162, 155, 254, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6c5ce7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background: #5a4bd1;
        }
        #error-msg {
            color: #ff7675;
            text-align: center;
            font-size: 14px;
            margin-top: 16px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="login-container" class="login-card">
        <h2>Michael AI</h2>
        <p class="subtitle">Enter your access key to continue<br><strong>Type 'AA' to access</strong></p>
        <form id="login-form">
            <div class="input-group">
                <label for="accessKey">Access Key</label>
                <input type="password" id="accessKey" placeholder="Type AA" required autocomplete="current-password">
            </div>
            <button type="submit" id="login-btn">Log In</button>
        </form>
        <div id="error-msg" role="alert"></div>
    </div>

    <div id="app" class="hidden"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
        const TOKEN_KEY = 'michael_token';
        const EXPIRY_KEY = 'michael_token_expires_at';
        const PERMANENT_KEY = 'michael_permanent_access';
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app');
        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-msg');

        function clearAccess() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(EXPIRY_KEY);
            localStorage.removeItem(PERMANENT_KEY);
        }

        function accessIsValid() {
            if (!localStorage.getItem(TOKEN_KEY)) return false;
            if (localStorage.getItem(PERMANENT_KEY) === 'true') return true;
            const expiresAt = Number(localStorage.getItem(EXPIRY_KEY));
            return Number.isFinite(expiresAt) && expiresAt > Date.now();
        }

        function showApp() {
            loginContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
        }

        if (accessIsValid()) {
            showApp();
        } else {
            clearAccess();
        }

        function enforceExpiry() {
            if (appContainer.classList.contains('hidden') || accessIsValid()) return;
            clearAccess();
            window.location.reload();
        }

        window.addEventListener('focus', enforceExpiry);
        document.addEventListener('visibilitychange', enforceExpiry);
        window.setInterval(enforceExpiry, 60000);

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorDiv.textContent = '';
            const accessKey = document.getElementById('accessKey').value.trim();

            try {
                const response = await fetch('https://michael-backend-foz7.onrender.com/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessKey })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Login failed.');
                if (!data.token) throw new Error('Render did not return an access token. Please try again.');

                localStorage.setItem(TOKEN_KEY, data.token);
                if (data.permanent === true) {
                    localStorage.setItem(PERMANENT_KEY, 'true');
                    localStorage.removeItem(EXPIRY_KEY);
                } else {
                    const expiresAt = Number(data.expiresAt);
                    if (!Number.isFinite(expiresAt) || expiresAt <= Date.now()) {
                        throw new Error('Render returned an invalid access expiry. Please try again.');
                    }
                    localStorage.setItem(EXPIRY_KEY, String(expiresAt));
                    localStorage.removeItem(PERMANENT_KEY);
                }

                showApp();
            } catch (error) {
                clearAccess();
                errorDiv.textContent = error.message || 'Could not connect to Render.';
            }
        });
    </script>
</body>
</html>
