<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0f0f17;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: #1e1e2f;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            border: 1px solid #6c5ce7;
        }
        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #a29bfe;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #fff;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #fff;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f0f17;
            border: 1px solid #6c5ce7;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #a29bfe;
            box-shadow: 0 0 0 2px rgba(162, 155, 254, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e17055;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background: #d35400;
        }
        button:active {
            background: #ba4a00;
        }
        #error-msg {
            color: #ff7675;
            text-align: center;
            font-size: 14px;
            margin-top: 16px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="login-container" class="login-card">
        <h2>Michael AI</h2>
        <p class="subtitle">Enter your access key to continue<br><strong>Use AA or your admin key</strong></p>
        <form id="login-form">
            <div class="input-group">
                <label for="accessKey">Access key</label>
                <input type="password" id="accessKey" placeholder="Enter AA or admin key" required autocomplete="current-password">
            </div>
            <button type="submit" id="login-btn">Log In</button>
        </form>
        <div id="error-msg" role="alert"></div>
    </div>
    <div id="app" class="hidden"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="module">
        const TOKEN_KEY = 'michael_token';
        const EXPIRY_KEY = 'michael_token_expires_at';
        const ROLE_KEY = 'michael_role';
        const AUTH_VERSION_KEY = 'michael_auth_version';
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app');
        const form = document.getElementById('login-form');
        const accessInput = document.getElementById('accessKey');
        const errorDiv = document.getElementById('error-msg');

        function clearAccess() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(EXPIRY_KEY);
            localStorage.removeItem(ROLE_KEY);
            localStorage.removeItem(AUTH_VERSION_KEY);
        }

        function accessIsValid() {
            const role = localStorage.getItem(ROLE_KEY);
            const expiresAt = Number(localStorage.getItem(EXPIRY_KEY));
            return Boolean(localStorage.getItem(TOKEN_KEY))
                && localStorage.getItem(AUTH_VERSION_KEY) === 'netlify-v1'
                && ['admin', 'consumer'].includes(role)
                && Number.isFinite(expiresAt)
                && expiresAt > Date.now();
        }

        function showApp() {
            loginContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
        }

        if (accessIsValid()) {
            showApp();
        } else {
            clearAccess();
        }

        function enforceExpiry() {
            if (appContainer.classList.contains('hidden') || accessIsValid()) return;
            clearAccess();
            window.location.reload();
        }

        window.addEventListener('focus', enforceExpiry);
        document.addEventListener('visibilitychange', enforceExpiry);
        window.setInterval(enforceExpiry, 60000);

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorDiv.textContent = '';
            const accessKey = accessInput.value.trim();
            const loginButton = document.getElementById('login-btn');
            loginButton.disabled = true;

            try {
                const authEndpoint = import.meta.env.VITE_NETLIFY_AUTH_URL || '/.netlify/functions/auth';
                const response = await fetch(authEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessKey })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Login failed.');
                if (typeof data.token !== 'string' || !['admin', 'consumer'].includes(data.role)) {
                    throw new Error('Netlify returned an invalid login response.');
                }
                const expiresAt = Number(data.expiresAt);
                if (!Number.isFinite(expiresAt) || expiresAt <= Date.now()) {
                    throw new Error('Netlify returned an invalid access expiry.');
                }

                localStorage.setItem(TOKEN_KEY, data.token);
                localStorage.setItem(ROLE_KEY, data.role);
                localStorage.setItem(EXPIRY_KEY, String(expiresAt));
                localStorage.setItem(AUTH_VERSION_KEY, 'netlify-v1');
                accessInput.value = '';
                showApp();
            } catch (error) {
                clearAccess();
                errorDiv.textContent = error.message || 'Could not connect to Netlify.';
            } finally {
                loginButton.disabled = false;
            }
        });
    </script>
</body>
</html>
